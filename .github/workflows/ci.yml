name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make test-unit

  integration:
    runs-on: ubuntu-latest # Docker is preinstalled; dockertest starts Postgres 17.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make test-integration
      - run: STORETEST_STRESS=light go test -race -count=1 -p=1 -tags=integration -run 'TestStress|TestStoreSuite/TestStress' ./store/...

  site:
    runs-on: ubuntu-latest # the simulator's JS port must agree with the Go library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node site/check-scenarios.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
