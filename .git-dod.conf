# git-dod — per-repo settings. Sourced by .githooks/commit-msg and
# .claude/hooks/dod_reminder.sh. This is the ONLY file you should need to edit;
# leave the hook scripts pristine so they can be updated from upstream.
# Docs: https://github.com/tggo/git-dod/blob/main/docs/adapting.md

# Commit types the hook accepts. Anything else is rejected (that is how typo
# divergence — "update:", "feture:" — gets caught). Keep in sync with CLAUDE.md.
TYPES="feat fix refactor perf docs test chore style build ci revert"

# Types that must explain themselves in the body.
EXPLAIN_TYPES="feat fix"

# Trailer keys required on those types.
REQUIRED_TRAILERS="Why Expected"

# Issue-key prefix ("[ABC-123]feat(x): …" / "ABC-123 feat: …"):
#   auto = strip it when present   on = require it   off = never strip
JIRA_PREFIX="auto"

# Escape hatch token (put it in a commit message to bypass the gate once).
SKIP_TOKEN="[skip-checks]"

# The living spec file.
DOD_FILE="DEFINITION_OF_DONE.md"

# Path prefixes the soft Stop-hook treats as "code". Empty = decide by file
# extension (CODE_EXTS in the hook), which suits most repos.
CODE_PATHS="apple google httpx store storetest internal examples"
