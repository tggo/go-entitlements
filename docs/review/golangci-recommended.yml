version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - unconvert
    - unparam
    - nolintlint
    - revive
    - wrapcheck
    - gosec
    - nilerr
    - exhaustive
    - forcetypeassert
    - perfsprint
    - intrange
    - copyloopvar
    - usestdlibvars
    - testifylint
    - thelper
    - prealloc
    - contextcheck
  settings:
    govet:
      enable: [shadow]
    gocritic:
      disabled-checks: [hugeParam, rangeValCopy]
    revive:
      rules:
        - name: exported
        - name: unused-parameter
        - name: error-naming
        - name: context-as-argument
    wrapcheck:
      ignore-package-globs: ['github.com/tggo/go-entitlements/*']
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets: [comments, std-error-handling]
    rules:
      - path: '(_test\.go|internal/testutil|examples/)'
        linters: [gosec, wrapcheck, errchkjson]
      - path: 'mocks/'
        linters: [revive, staticcheck]
